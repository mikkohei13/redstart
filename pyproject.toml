[project]
name = "redstart"
version = "0.1.0"
description = "Desktop spectrogram player for long WAV recordings"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "soundfile>=0.12,<1",
    "sounddevice>=0.5,<1",
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13,<1",
]

[project.scripts]
redstart = "redstart.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redstart"]
